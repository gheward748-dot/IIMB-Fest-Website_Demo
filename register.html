<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register for IIMB Fest</title>
  </head>
  <body>
<header>
    <img src="https://www.iimb.ac.in/sites/default/files/inline-images/IIMB-Logo.png" alt="IIMB Logo" width="400" height="100">
    <img src="https://www.iimb.ac.in/sites/default/files/inline-images/IIMB-Logo.png" alt="IIMB Logo"height=40px>
    <h1>IIMB Fest 2026</h1>
    <p>Welcome to the IIMB Fest 2026!Hope you have a great time.</p>
    <nav>
        <a href="./index.html">Click here to back to home page</a>
        

    </nav>
</header>
    <main>
    
        <h2>Register for the Fest</h2>
    <form action="/register" method="get">
      <label for="name">Enter yourName:</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required minlength="3" maxlength="20">
      <br><br>
      <label for="email">Eneter your Email:</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required >
      <br><br>
      <label for="T shirt size">Select your T-shirt size:</label>
      <select name="T shirt size" id="T shirt size" required>
        <option value="">Select your T-shirt size</option>
        <option value="S">32</option>
        <option value="M">34</option>
        <option value="L">36</option>
        <option value="XL">38</option>
      </select>
      <br><br>
        <label for="terms">I agree to the terms and conditions:</label>
      <input type="checkbox" id="terms" name="terms" required>
      <br><br>
      <label for="student">Student</label>
      <input type="radio" name="attendee type" id="student" value="student">
      <label for="alumni">Alumni</label>
      <input type="radio" name="attendee type" id="alumni" value="alumni">
      <br><br>
      <button type="submit">Register Now</button>
    </form>
    <hr>
    </section>
    
    </main>
    
        </section>
    
    
  </body>
</html>
